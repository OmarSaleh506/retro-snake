<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNAKE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      color: #22c55e;
      user-select: none;
      padding: 16px;
    }

    #title {
      font-size: 14px;
      letter-spacing: 6px;
      text-shadow: 0 0 10px #22c55e;
      margin-bottom: 12px;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      width: min(400px, calc(100vw - 32px));
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 6px;
      opacity: 0.85;
    }

    #score, #hi { color: #4ade80; }

    #canvas-wrap {
      position: relative;
      width: min(400px, calc(100vw - 32px));
      height: min(400px, calc(100vw - 32px));
      border: 1px solid #22c55e;
      box-shadow: 0 0 16px #22c55e44, inset 0 0 16px #00000088;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hint {
      margin-top: 10px;
      font-size: 9px;
      letter-spacing: 2px;
      opacity: 0.45;
    }

    #scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.15) 2px,
        rgba(0, 0, 0, 0.15) 4px
      );
      pointer-events: none;
      z-index: 2;
    }

    #vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
      z-index: 3;
    }

    @keyframes flicker {
      0%   { opacity: 1; }
      10%  { opacity: 0.6; }
      20%  { opacity: 1; }
      30%  { opacity: 0.75; }
      40%  { opacity: 1; }
      100% { opacity: 1; }
    }

    #canvas-wrap.flicker {
      animation: flicker 0.4s ease-out forwards;
    }

    #controls {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
    }

    .dpad-row {
      display: flex;
      gap: 6px;
    }

    .dpad-btn {
      width: 60px;
      height: 60px;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .dpad-btn:active {
      background: rgba(34, 197, 94, 0.25);
    }

    @media (pointer: coarse) {
      #controls { display: flex; }
      #hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="title">▓▓ SNAKE ▓▓</div>
  <div id="hud">
    <span id="score-display">SCORE: <span id="score">0000</span></span>
    <span id="hi-display">HIGH: <span id="hi">0000</span></span>
  </div>
  <div id="canvas-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="scanlines" aria-hidden="true"></div>
    <div id="vignette" aria-hidden="true"></div>
  </div>
  <div id="hint">↑ ↓ ← →  OR  W A S D  TO MOVE</div>
  <div id="controls" aria-label="Directional controls">
    <div class="dpad-row">
      <button class="dpad-btn" data-dir="UP" aria-label="Up">▲</button>
    </div>
    <div class="dpad-row">
      <button class="dpad-btn" data-dir="LEFT" aria-label="Left">◀</button>
      <button class="dpad-btn" data-dir="DOWN" aria-label="Down">▼</button>
      <button class="dpad-btn" data-dir="RIGHT" aria-label="Right">▶</button>
    </div>
  </div>

  <script>
    const COLS = 20;
    const ROWS = 20;
    const CELL = 20;
    const BASE_SPEED = 150;
    const MIN_SPEED = 60;

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const hiEl = document.getElementById('hi');
    const canvasWrap = document.getElementById('canvas-wrap');

    const DIR = { UP: {x:0,y:-1}, DOWN: {x:0,y:1}, LEFT: {x:-1,y:0}, RIGHT: {x:1,y:0} };

    const OPPOSITE = new Map([
      [DIR.UP, DIR.DOWN], [DIR.DOWN, DIR.UP],
      [DIR.LEFT, DIR.RIGHT], [DIR.RIGHT, DIR.LEFT],
    ]);

    let state;

    function initState() {
      state = {
        snake: [
          { x: 12, y: 10 },
          { x: 11, y: 10 },
          { x: 10, y: 10 },
        ],
        dir: DIR.RIGHT,
        nextDir: DIR.RIGHT,
        food: null,
        score: 0,
        highScore: loadHighScore(),
        foodEaten: 0,
        speed: BASE_SPEED,
        gameState: 'START',
        loopId: null,
      };
      state.food = spawnFood();
      updateHUD();
    }

    function spawnFood() {
      const occupied = new Set(state.snake.map(s => `${s.x},${s.y}`));
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (occupied.has(`${pos.x},${pos.y}`));
      return pos;
    }

    function loadHighScore() {
      try { return Math.max(0, Number(localStorage.getItem('snake-highscore')) || 0); }
      catch { return 0; }
    }

    function pad4(n) {
      return String(n).padStart(4, '0');
    }

    function updateHUD() {
      scoreEl.textContent = pad4(state.score);
      hiEl.textContent = pad4(state.highScore);
    }

    function setDir(newDir) {
      if (OPPOSITE.get(state.dir) === newDir) return;
      state.nextDir = newDir;
    }

    document.addEventListener('keydown', (e) => {
      const keyMap = {
        ArrowUp: DIR.UP, w: DIR.UP, W: DIR.UP,
        ArrowDown: DIR.DOWN, s: DIR.DOWN, S: DIR.DOWN,
        ArrowLeft: DIR.LEFT, a: DIR.LEFT, A: DIR.LEFT,
        ArrowRight: DIR.RIGHT, d: DIR.RIGHT, D: DIR.RIGHT,
      };

      if (state.gameState === 'START' || state.gameState === 'GAME_OVER') {
        startGame();
        return;
      }

      const newDir = keyMap[e.key];
      if (!newDir) return;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
      setDir(newDir);
    });

    let touchX = 0, touchY = 0;

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
      if (state.gameState !== 'PLAYING') startGame();
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (state.gameState !== 'PLAYING') return;
      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
      setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIR.RIGHT : DIR.LEFT) : (dy > 0 ? DIR.DOWN : DIR.UP));
    }, { passive: false });

    document.querySelectorAll('.dpad-btn').forEach(btn => {
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (state.gameState === 'START' || state.gameState === 'GAME_OVER') { startGame(); return; }
        setDir(DIR[btn.dataset.dir]);
      }, { passive: false });
      btn.addEventListener('click', () => {
        if (state.gameState === 'START' || state.gameState === 'GAME_OVER') { startGame(); return; }
        setDir(DIR[btn.dataset.dir]);
      });
    });

    function startGame() {
      if (state.loopId) clearInterval(state.loopId);
      initState();
      state.gameState = 'PLAYING';
      state.loopId = setInterval(tick, state.speed);
    }

    function update() {
      state.dir = state.nextDir;

      const head = state.snake[0];
      const newHead = {
        x: (head.x + state.dir.x + COLS) % COLS,
        y: (head.y + state.dir.y + ROWS) % ROWS,
      };

      const body = state.snake.slice(0, -1);
      const hitSelf = body.some(s => s.x === newHead.x && s.y === newHead.y);
      if (hitSelf) {
        endGame();
        return;
      }

      state.snake.unshift(newHead);

      if (newHead.x === state.food.x && newHead.y === state.food.y) {
        state.foodEaten++;
        state.score = state.foodEaten * 10;
        if (state.score > state.highScore) {
          state.highScore = state.score;
          try { localStorage.setItem('snake-highscore', state.highScore); } catch {}
        }
        state.food = spawnFood();
        updateHUD();

        if (state.foodEaten % 5 === 0) {
          state.speed = Math.max(MIN_SPEED, state.speed - 10);
          clearInterval(state.loopId);
          state.loopId = setInterval(tick, state.speed);
        }
      } else {
        state.snake.pop();
      }
    }

    function endGame() {
      state.gameState = 'GAME_OVER';
      clearInterval(state.loopId);
      if (state.score > state.highScore) {
        state.highScore = state.score;
        try { localStorage.setItem('snake-highscore', state.highScore); } catch {}
      }
      canvasWrap.classList.remove('flicker');
      void canvasWrap.offsetWidth;
      canvasWrap.classList.add('flicker');
      setTimeout(() => canvasWrap.classList.remove('flicker'), 450);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(34, 197, 94, 0.06)';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * CELL, 0);
        ctx.lineTo(x * CELL, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * CELL);
        ctx.lineTo(canvas.width, y * CELL);
        ctx.stroke();
      }

      const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 200);
      ctx.shadowBlur = 10 * pulse;
      ctx.shadowColor = '#ef4444';
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(
        state.food.x * CELL + CELL / 2,
        state.food.y * CELL + CELL / 2,
        CELL / 2 - 3,
        0, Math.PI * 2
      );
      ctx.fill();

      state.snake.forEach((seg, i) => {
        const isHead = i === 0;
        const alpha = Math.max(0.4, 1 - i * 0.04);
        ctx.shadowBlur = isHead ? 14 : 6;
        ctx.shadowColor = isHead ? '#4ade80' : '#22c55e';
        ctx.fillStyle = isHead
          ? `rgba(74, 222, 128, ${alpha})`
          : `rgba(34, 197, 94, ${alpha})`;
        ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
      });

      ctx.shadowBlur = 0;
    }

    function drawStartScreen() {
      ctx.fillStyle = 'rgba(0,0,0,0.78)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#4ade80';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#22c55e';
      ctx.font = 'bold 28px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('▓▓ SNAKE ▓▓', canvas.width / 2, 160);

      ctx.font = '11px monospace';
      ctx.fillStyle = '#22c55e';
      ctx.shadowBlur = 0;
      ctx.fillText(`HIGH: ${pad4(state.highScore)}`, canvas.width / 2, 200);

      ctx.fillStyle = '#4ade80';
      ctx.font = '10px monospace';
      ctx.fillText('TAP OR PRESS ANY KEY', canvas.width / 2, 260);
      ctx.textAlign = 'left';
    }

    function drawGameOverScreen() {
      ctx.fillStyle = 'rgba(0,0,0,0.78)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ef4444';
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#ef4444';
      ctx.font = 'bold 28px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, 160);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#22c55e';
      ctx.font = '11px monospace';
      ctx.fillText(`SCORE: ${pad4(state.score)}`, canvas.width / 2, 200);
      ctx.fillText(`HIGH:  ${pad4(state.highScore)}`, canvas.width / 2, 220);

      ctx.fillStyle = '#4ade80';
      ctx.font = '10px monospace';
      ctx.fillText('TAP OR PRESS ANY KEY', canvas.width / 2, 270);
      ctx.textAlign = 'left';
    }

    function tick() {
      if (state.gameState === 'PLAYING') update();
    }

    function render() {
      draw();
      if (state.gameState === 'START') drawStartScreen();
      if (state.gameState === 'GAME_OVER') drawGameOverScreen();
    }

    function animLoop() {
      render();
      requestAnimationFrame(animLoop);
    }

    initState();
    animLoop();
  </script>
</body>
</html>
